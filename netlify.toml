[build]
  # Primero se preparan las hojas de estilo originales (junta css-original/ en
  # public/css/) y despues se compila. Si se compilara sin ese paso, la web
  # saldria sin los estilos del tema.
  command = "npm run css && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------- seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ------------------------------------------------------------------- cache
# Las rutas de /wp-content/uploads/ no cambian nunca: se cachean un ano.
[[headers]]
  for = "/wp-content/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --------------------------------------------------------------- indexacion
# Aqui iba un X-Robots-Tag "noindex, nofollow" para que Google no indexara la
# copia de Netlify mientras el dominio apuntaba al hosting viejo. Se quito el
# 28-09-2026, el dia del cambio de DNS: con el dominio en Netlify, esa
# cabecera habria sacado toda la web de Google. La copia de *.netlify.app no
# compite: cada pagina lleva su canonical a https://casascontenedores.es.
